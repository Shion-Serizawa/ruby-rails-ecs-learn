# PostgreSQL
#
# 接続情報は環境変数で注入する (12-factor)。
#   開発: compose.yaml で設定
#   本番(ECS): タスク定義の environment / secrets (Secrets Manager) で設定
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# 開発環境でも本番と同様に Solid Queue を別DBで動かす
development:
  primary:
    <<: *default
    database: conf_notes_development
  queue:
    <<: *default
    database: conf_notes_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
test:
  <<: *default
  database: conf_notes_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "conf_notes_production") %>
    # RDS への接続は TLS 必須 + 証明書検証。CA バンドルは Dockerfile でイメージに同梱している。
    # ローカルの compose.production.yaml では DB_SSLMODE=disable にする
    sslmode: <%= ENV.fetch("DB_SSLMODE", "verify-full") %>
    sslrootcert: <%= ENV.fetch("DB_SSLROOTCERT", "/etc/ssl/certs/rds-global-bundle.pem") %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME", "conf_notes_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME", "conf_notes_production") %>_queue
    migrations_paths: db/queue_migrate
