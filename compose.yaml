# 開発環境: docker compose up
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: conf_notes-dev
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    RAILS_ENV: ${RAILS_ENV:-development}
  depends_on:
    db:
      condition: service_healthy
  tty: true
  stdin_open: true

services:
  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"

  # Tailwind CSS のビルド監視
  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]

  # Solid Queue ワーカー (非同期ジョブ)
  worker:
    <<: *app
    command: bin/jobs
    depends_on:
      web:
        condition: service_started

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  bundle:
  pgdata:
