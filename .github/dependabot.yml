# 依存関係の自動更新 (https://docs.github.com/code-security/dependabot)
#
# 学習用リポジトリなので PR が溜まらないよう控えめに運用する:
#   - チェックは月1回、各エコシステムで同時に開く PR は1件まで
#   - 更新はエコシステムごとに1つの PR にまとめる
#   - 脆弱性の修正 PR (Security updates) はこのスケジュールとは別に、必要なときだけ届く
# PR タイトルは Conventional Commits 形式 (build(deps): / ci(deps):) になる
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      bundler:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # compose の postgres / mailpit イメージ
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-compose:
        patterns: ["*"]
