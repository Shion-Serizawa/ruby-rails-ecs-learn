# 依存関係の自動更新 (https://docs.github.com/code-security/dependabot)
# PR タイトルは Conventional Commits 形式 (build(deps): / ci(deps):) になる
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      # minor / patch はまとめて1つの PR にしてノイズを減らす (major は個別に精査)
      bundler-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # compose の postgres / mailpit イメージ
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
